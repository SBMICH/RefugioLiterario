# Configuración del análisis de SonarQube Cloud
sonar.projectKey=SBMICH_RefugioLiterario
sonar.organization=sbmich
sonar.projectName=Refugio Literario

sonar.sources=.
sonar.tests=tests
sonar.exclusions=venv/**,**/__pycache__/**,static/images/**,tests/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Informe de cobertura que generan las pruebas en GitHub Actions
sonar.python.coverage.reportPaths=coverage.xml
# Los scripts de herramientas/ solo se usan en desarrollo: no cuentan para la cobertura
sonar.coverage.exclusions=herramientas/**,tests/**,static/js/**
