{% include 'header.html' %}
<main class="page admin narrow">
    <a href="{{ url_for('admin', tab='usuarios') }}" class="back-link">‹ Volver a usuarios</a>
    <div class="admin-card">
        <h1>Editar usuario</h1>
        <form action="{{ url_for('editar_usuario', user_id=usuario[0]) }}" method="post" class="form-grid">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group span-2">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" value="{{ usuario[1] }}" required>
            </div>
            <div class="form-group span-2">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" value="{{ usuario[2] }}" required>
            </div>
            <label class="checkbox span-2">
                <input type="checkbox" id="is_admin" name="is_admin" {% if usuario[4] %}checked{% endif %}>
                <span>Es administrador</span>
            </label>
            <div class="form-actions span-2">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a href="{{ url_for('admin', tab='usuarios') }}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</main>
{% include 'footer.html' %}
