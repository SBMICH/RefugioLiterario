{% include 'header.html' %}
<main class="page">
    <div class="page-header">
        <div>
            <p class="eyebrow">Último paso</p>
            <h1>Confirmar compra</h1>
        </div>
    </div>

    <div class="cart-layout">
    <form action="{{ url_for('finalizar_compra') }}" method="post" class="panel checkout-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h2>Datos de envío</h2>
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="direccion">Dirección de Envío</label>
            <input type="text" id="direccion" name="direccion" required>
        </div>
        <div class="form-group">
            <label for="ciudad">Ciudad</label>
            <input type="text" id="ciudad" name="ciudad" required>
        </div>
        <div class="form-group">
            <label for="codigo_postal">Código Postal</label>
            <input type="text" id="codigo_postal" name="codigo_postal" required>
        </div>

        <h2>Método de pago</h2>
        <div class="form-group">
            <label for="metodo_pago">Seleccione un método de pago</label>
            <select name="metodo_pago" id="metodo_pago" required>
                <option value="">Seleccione una opción</option>
                <option value="tarjeta_credito">Tarjeta de Crédito</option>
                <option value="paypal">PayPal</option>
                <option value="transferencia">Transferencia Bancaria</option>
            </select>
        </div>

        <div id="tarjeta_credito_fields" style="display: none;">
            <div class="form-group">
                <label for="numero_tarjeta">Número de Tarjeta</label>
                <input type="text" id="numero_tarjeta" name="numero_tarjeta">
            </div>
            <div class="form-group">
                <label for="fecha_vencimiento">Fecha de Vencimiento</label>
                <input type="text" id="fecha_vencimiento" name="fecha_vencimiento" placeholder="MM/AA">
            </div>
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv">
            </div>
        </div>

        <div id="paypal_fields" style="display: none;">
            <div class="form-group">
                <label for="paypal_email">Correo Electrónico de PayPal</label>
                <input type="email" id="paypal_email" name="paypal_email">
            </div>
        </div>

        <div id="transferencia_fields" style="display: none;">
            <div class="form-group">
                <label for="banco">Banco</label>
                <input type="text" id="banco" name="banco">
            </div>
            <div class="form-group">
                <label for="titular_cuenta">Titular de la Cuenta</label>
                <input type="text" id="titular_cuenta" name="titular_cuenta">
            </div>
            <div class="form-group">
                <label for="numero_cuenta">Número de Cuenta</label>
                <input type="text" id="numero_cuenta" name="numero_cuenta">
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" onclick="return confirm('¿Confirmas esta compra?');">Confirmar compra</button>
    </form>

    <aside class="summary-card">
        <h2>Resumen</h2>
        <ul class="summary-list">
            {% for libro in libros %}
            <li><span>{{ libro[1] }}<small class="muted">{{ libro[2] }}</small></span><span>{{ libro[3] | precio }}</span></li>
            {% endfor %}
        </ul>
        <div class="summary-row total"><span>Total</span><span>{{ total_precio | precio }}</span></div>
        <a href="{{ url_for('ver_carrito') }}" class="btn btn-ghost btn-block">Volver al carrito</a>
    </aside>
    </div>
</main>
{% include 'footer.html' %}
